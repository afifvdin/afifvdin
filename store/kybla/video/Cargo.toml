[package]
name = "video"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fframes = { version = "=1.1.0", features = ["compile-time-svgtree", "cli"] }
fframes_skia_renderer = { version = "=1.1.0", features = ["metal"] }
fframes_native_player = { version = "=1.1.0", default-features = false, features = ["metal", "audio"] }
# fframes 1.1.0 accepts ^1.1 helpers, but their 1.2 releases pull usvgr 0.46.1, which it cannot compile against.
fframes-media = "=1.1.0"
fframes-media-dir-macro = "=1.1.0"

[target.'cfg(not(windows))'.dependencies]
fframes = { version = "=1.1.0", features = ["h264", "libav-agree-gpl"] }

[lib]
name = "video"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "video"
path = "src/main.rs"

[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

